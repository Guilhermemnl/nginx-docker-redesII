events {
    worker_connections 1024;
}
http {
    upstream servidores_http {
        server servehttp-1:80;
        server servehttp-2:80;
    }
    server {
        listen 80;
        server_name localhost;
        location = / {
            proxy_pass http://servidores_http/pagina.html;
            proxy_set_header Host $host;
        }
        location = /servidor1 {
            proxy_pass http://servehttp-1:80/pagina.html;
            proxy_set_header Host $host;
        }
        location = /servidor2 {
            proxy_pass http://servehttp-2:80/pagina.html;
            proxy_set_header Host $host;
        }
    }
}