
services:
 
  servemdns:
    build:
      context: ./serveMDNS
    container_name: servemdns-avahi
    hostname: proxy
    networks:
      - rede-projeto

  servehttp-1abc:
    image: nginx:alpine
    container_name: servehttp-1abc
    volumes:
      - ./serveHTTP-1:/usr/share/nginx/html:ro
    networks:
      rede-projeto:
        ipv4_address: 172.30.0.21

  servehttp-2abc:
    image: nginx:alpine
    container_name: servehttp-2abc
    volumes:
      - ./serveHTTP-2:/usr/share/nginx/html:ro
    networks:
      rede-projeto:
        ipv4_address: 172.30.0.22



  serveproxy-loadbalancer:
    image: nginx:alpine
    container_name: serveproxy-loadbalancer
    ports:
      - "8080:80"
    volumes:
      - ./serveProxy-LoadBalancer/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - servehttp-1abc
      - servehttp-2abc
    networks:
      - rede-projeto


  servedhcp-dns:
    image: projeto-dnsmasq:latest
    build:
      context: ./serveDHCP-DNS
    container_name: servedhcp-dns
    networks:
      rede-projeto:
        ipv4_address: 172.30.0.10


networks:
  rede-projeto:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
